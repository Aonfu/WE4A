<div class="centrer">
    <div class="catalogue-grid">
        <div class="card no-hover" id="tri">
            <div class="card-body">
                <details class="form">
                    <summary class="pawnstar-font">Trier Prix</summary>
                    <div class="form-field">
                        <label class="card-text" for="prix_min">Plus de :</label>
                        <input class="form-control form-input" type="number" placeholder="$" #prix_min>
                    </div>
                    <div class="form-field">
                        <label class="card-text" for="prix_max">Moins de :</label>
                        <input class="form-control form-input" type="number" placeholder="$" #prix_max>
                    </div>
                    <div class="form-field">
                        <button class="button text-decoration-none" (click)="charger({tri: 'prix_asc'})">Prix croissant</button>
                    </div>
                    <div class="form-field">
                        <button class="button text-decoration-none" (click)="charger({tri: 'prix_desc'})">Prix décroissant</button>
                    </div>
                    <button class="button" (click)="charger({prix_min: prix_min.value, prix_max: prix_max.value})">Filtrer</button>
                </details>
                <details class="form">
                    <summary class="pawnstar-font">Catégories</summary>
                    @for (cat of categories; track cat.id_categorie) {
                        <button class="button text-decoration-none categorie" (click)="charger({categorie: cat.id_categorie})">{{ cat.nom }}</button>
                    }
                </details>
            </div>
        </div>

        @for (row of produits; track row.id_produit) {
            <div class="card">
                <div class="card-images">
                    <img src="{{ row.photo }}" class="card-img-top" alt="...">
                    <img src="ressources/img/scotch.png" class="scotch-1" alt="...">
                    <img src="ressources/img/scotch.png" class="scotch-2" alt="...">
                </div>
                <div class="card-body">
                    <h3 class="card-text card-title">{{ row.nom }}</h3>
                    <p class="card-text">{{ row.description }}</p>
                    <h1 class="card-text pawnstar-font">${{ row.montant }}</h1>
                </div>
                <a [routerLink]="['/enchere', row.id_produit]" class="stretched-link text-decoration-none"></a>
            </div>
        }
    </div>
</div>
